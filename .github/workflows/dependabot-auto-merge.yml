name: Dependabot auto-merge (reusable)

# Reusable workflow: merges Dependabot pull requests once CI has passed, up to
# a configured semver ceiling. CI is the only gate. It only ever touches pull
# requests opened by dependabot[bot]. No ruleset or branch protection is
# involved, so nobody else's pull requests or pushes are gated by anything here.
#
# Each repository keeps a short caller workflow that owns the triggers
# (reusable workflows cannot declare their own) and passes config as inputs.
# See the README of this repository for the caller snippet. Pin `uses:` to a
# commit SHA: this workflow runs with a write token in every caller.
#
# The caller must trigger on:
#
#   pull_request_target: types [opened, synchronize, reopened]
#   workflow_run:        workflows [<every workflow `name:` whose completion
#                        may attempt a merge>], types [completed]
#
# In auto mode (empty required-checks), list every workflow that runs on
# pull_request: if the last one to finish is not listed, nothing triggers the
# merge and the pull request stays open.
#
# and grant the calling job: contents: write, pull-requests: write,
# issues: write, checks: read, actions: write. All five are always required,
# even when deploy-workflow is empty: the label job declares issues: write
# (to create automerge-label on first use) and the merge job declares
# actions: write, and GitHub rejects the whole run at startup if the caller
# grants less than any job in this workflow declares. Jobs below ask for
# less where they can. The `github` context (event, actor, repository) is
# the caller's, so every condition below behaves exactly as it would inline.
#
# Inputs
#
# allowed-updates is a ceiling, judged from Dependabot's own update-type
# (including grouped pull requests, where that type is the highest bump in the
# group):
#   patch — version-update:semver-patch only
#   minor — patch and minor
#   major — patch, minor and major
# The label job reads it from dependabot/fetch-metadata. The merge job reads
# the same `update-type:` lines out of the Dependabot commit message and
# applies the ceiling again, so tightening the config takes effect even when a
# pull request was labelled under a looser setting. An empty or unrecognised
# update-type (some security updates) is eligible only when allow-unclassified
# is "true". A security update Dependabot *has* classified still has to fit
# under the ceiling: there is no separate "merge every advisory" path.
#
# skip-ecosystems (comma or newline separated) is matched against
# fetch-metadata's package-ecosystem, which is also the second segment of the
# head branch. That is `github_actions` and `npm_and_yarn`, not the
# dependabot.yml names `github-actions` and `npm`. GitHub Actions bumps stay
# manual by default: they edit .github/workflows/, and GITHUB_TOKEN cannot be
# granted the `workflows` permission required to merge such a change. The
# merge job also refuses any pull request that touches .github/workflows/,
# whatever the ecosystem.
#
# required-checks is one check-run name per line (the job's `name:`, exactly).
# Lines starting with # are ignored. Only GitHub Actions check runs count
# (app id 15368), so another app cannot satisfy a name.
# Leave it empty for auto mode: the latest attempt of every `pull_request`
# workflow run on the head commit must have completed as success, skipped or
# neutral, and there must be at least one. Auto mode needs no per-repo check
# names, but it trusts whatever workflows run on pull requests.
#
# deploy-workflow is optional. A merge made with GITHUB_TOKEN does not fire
# push-triggered workflows, so set this to a workflow file that has
# workflow_dispatch when a deploy has to be started after the merge. Leave it
# empty to skip that. deploy-ref defaults to the pull request's base branch
# when empty.
#
# merge-method is squash, merge, or rebase. automerge-label is the label the
# label job manages.
#
# request-review ("true" by default) asks a person to review any Dependabot
# pull request this workflow will not merge itself: one above the ceiling
# (a major, with the default `minor`), an unclassified one when
# allow-unclassified is not "true", a skipped ecosystem, or one touching
# .github/workflows/. The request is made by the merge job, so it only
# happens once the required checks (or, in auto mode, every pull_request
# workflow run) on the head commit have passed, which is the same gate a
# merge would have used. Include any preview build in required-checks so the
# review is only requested once the preview built. A login already requested,
# or that already reviewed the head commit, is not asked again, so repeated
# workflow_run events are harmless. Any native auto-merge left enabled on such
# a pull request is turned off.
#
# reviewers is the logins to ask (comma or newline separated). Empty means the
# repository owner when that is a user account. Organisation-owned
# repositories must name someone, or no review is requested (a warning says so).
#
# Two jobs:
#
#   label  (pull_request_target) adds the label when the bump is within the
#          ceiling, and removes it (and turns off any native auto-merge) when
#          a later push is not. It never checks out the pull request.
#
#   merge  (workflow_run) merges only when the pull request is still open,
#          authored by dependabot[bot], carries the label, its head is still
#          the commit CI ran against, the commit message is still within the
#          ceiling, the required checks (or, in auto mode, every pull_request
#          workflow run) on that commit succeeded, and nothing under
#          .github/workflows/ changed. Anything else exits quietly. A merge
#          GitHub refuses (a conflict, or a stale branch after a sibling
#          merged) is a warning and is left for Dependabot to rebase. A pull
#          request it will not merge gets a review request instead, once the
#          same checks have passed (see request-review).
#
# Neither job checks out or runs the pull request's code. That is what makes
# these triggers safe with a write token. Keep it that way. Inputs reach the
# scripts only through env, never through ${{ }} inside `run:`.
on:
  workflow_call:
    inputs:
      allowed-updates:
        description: "Semver ceiling: patch, minor, or major."
        type: string
        default: minor
      allow-unclassified:
        description: '"true" to merge updates with an empty or unrecognised update-type.'
        type: string
        default: "true"
      skip-ecosystems:
        description: "fetch-metadata package-ecosystem values never auto-merged (comma or newline separated)."
        type: string
        default: github_actions
      required-checks:
        description: "Check-run names, one per line. Empty = auto mode (every pull_request workflow run must be green)."
        type: string
        default: ""
      deploy-workflow:
        description: "Workflow file with workflow_dispatch to run after a merge. Empty = none."
        type: string
        default: ""
      deploy-ref:
        description: "Ref to dispatch deploy-workflow on. Empty = the pull request's base branch."
        type: string
        default: ""
      merge-method:
        description: "squash, merge, or rebase."
        type: string
        default: squash
      automerge-label:
        description: "Label marking a pull request as within policy."
        type: string
        default: "automerge:ok"
      request-review:
        description: '"true" to request a review on Dependabot PRs left for a person (for example majors) once the required checks pass.'
        type: string
        default: "true"
      reviewers:
        description: "Logins to request a review from (comma or newline separated). Empty = the repository owner, when that is a user account."
        type: string
        default: ""

permissions: {}

env:
  ALLOWED_UPDATES: ${{ inputs.allowed-updates }}
  ALLOW_UNCLASSIFIED: ${{ inputs.allow-unclassified }}
  SKIP_ECOSYSTEMS: ${{ inputs.skip-ecosystems }}
  REQUIRED_CHECKS: ${{ inputs.required-checks }}
  DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
  DEPLOY_REF: ${{ inputs.deploy-ref }}
  MERGE_METHOD: ${{ inputs.merge-method }}
  AUTOMERGE_LABEL: ${{ inputs.automerge-label }}
  REQUEST_REVIEW: ${{ inputs.request-review }}
  REVIEWERS: ${{ inputs.reviewers }}

jobs:
  label:
    name: Label for auto-merge
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # creates automerge-label on first use
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the auto-merge label from the semver ceiling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          # Shared auto-merge policy. Pasted into both jobs so the workflow never checks
          # out a repository (pull_request_target and workflow_run carry a write token).

          trim() {
            local s="$1"
            s="${s//$'\r'/}"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          ecosystem_skipped() {
            local ecosystem="$1"
            local skip="$2"
            local item
            [ -z "$skip" ] && return 1
            while IFS= read -r item || [ -n "$item" ]; do
              item=$(trim "$item")
              if [ -n "$item" ] && [ "$item" = "$ecosystem" ]; then
                return 0
              fi
            done <<< "$(printf '%s' "$skip" | tr ',' '\n')"
            return 1
          }

          # stdout: one reason line. Returns 0 when eligible, 1 when not, 2 on bad config.
          eligible() {
            local update_type="$1"
            local ecosystem="$2"
            local allowed="$3"
            local allow_unclassified="$4"
            local skip="$5"

            update_type=$(trim "$update_type")
            ecosystem=$(trim "$ecosystem")
            allowed=$(trim "$allowed")
            allow_unclassified=$(trim "$allow_unclassified")

            case "$allowed" in
              patch|minor|major) ;;
              *)
                echo "::error::ALLOWED_UPDATES must be patch, minor, or major."
                return 2
                ;;
            esac

            case "$allow_unclassified" in
              true|false) ;;
              *)
                echo "::error::ALLOW_UNCLASSIFIED must be true or false."
                return 2
                ;;
            esac

            if ecosystem_skipped "$ecosystem" "$skip"; then
              if printf '%s' "$ecosystem" | grep -Eq '^[A-Za-z0-9_.+-]+$'; then
                echo "package-ecosystem '$ecosystem' is in SKIP_ECOSYSTEMS; not auto-merging."
              else
                echo "package-ecosystem is in SKIP_ECOSYSTEMS; not auto-merging."
              fi
              return 1
            fi

            case "$update_type" in
              version-update:semver-patch|version-update:semver-minor|version-update:semver-major)
                ;;
              "")
                if [ "$allow_unclassified" = "true" ]; then
                  echo "update-type is empty and ALLOW_UNCLASSIFIED=true; eligible."
                  return 0
                fi
                echo "update-type is empty and ALLOW_UNCLASSIFIED is not true; not auto-merging."
                return 1
                ;;
              *)
                if [ "$allow_unclassified" = "true" ]; then
                  echo "update-type is unrecognised and ALLOW_UNCLASSIFIED=true; eligible."
                  return 0
                fi
                echo "update-type is unrecognised and ALLOW_UNCLASSIFIED is not true; not auto-merging."
                return 1
                ;;
            esac

            case "$allowed:$update_type" in
              patch:version-update:semver-patch|\
              minor:version-update:semver-patch|minor:version-update:semver-minor|\
              major:version-update:semver-patch|major:version-update:semver-minor|major:version-update:semver-major)
                echo "update-type $update_type is within ALLOWED_UPDATES=$allowed; eligible."
                return 0
                ;;
            esac

            echo "update-type $update_type is above ALLOWED_UPDATES=$allowed; not auto-merging."
            return 1
          }

          # Highest semver update-type declared in Dependabot commit messages.
          # Prints nothing when every commit omits a recognised update-type line.
          highest_update_type() {
            local messages="$1"
            local line rank=0
            while IFS= read -r line || [ -n "$line" ]; do
              line=$(trim "$line")
              case "$line" in
                "update-type: version-update:semver-major")
                  rank=3
                  ;;
                "update-type: version-update:semver-minor")
                  if [ "$rank" -lt 2 ]; then rank=2; fi
                  ;;
                "update-type: version-update:semver-patch")
                  if [ "$rank" -lt 1 ]; then rank=1; fi
                  ;;
              esac
            done <<< "$messages"
            case "$rank" in
              3) printf '%s' "version-update:semver-major" ;;
              2) printf '%s' "version-update:semver-minor" ;;
              1) printf '%s' "version-update:semver-patch" ;;
              *) printf '' ;;
            esac
          }

          # Second path segment of a Dependabot head branch:
          # dependabot/npm_and_yarn/website/lodash-4.2.3 -> npm_and_yarn
          branch_ecosystem() {
            local branch="$1" rest
            case "$branch" in
              dependabot/*/*) ;;
              *)
                printf ''
                return 0
                ;;
            esac
            rest=${branch#dependabot/}
            printf '%s' "${rest%%/*}"
          }

          set -euo pipefail

          if ! printf '%s' "$AUTOMERGE_LABEL" | grep -Eq '^[A-Za-z0-9_.:/-]+$'; then
            echo "::error::AUTOMERGE_LABEL is empty or contains unsupported characters."
            exit 1
          fi

          set +e
          reason=$(eligible "$UPDATE_TYPE" "$PACKAGE_ECOSYSTEM" "$ALLOWED_UPDATES" "$ALLOW_UNCLASSIFIED" "$SKIP_ECOSYSTEMS")
          rc=$?
          set -e
          printf '%s\n' "$reason"

          if [ "$rc" -eq 2 ]; then
            exit 1
          fi

          names=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name')
          labelled=false
          if printf '%s\n' "$names" | grep -Fxq "$AUTOMERGE_LABEL"; then
            labelled=true
          fi

          if [ "$rc" -eq 0 ]; then
            if [ "$labelled" = true ]; then
              echo "PR #$PR_NUMBER already has $AUTOMERGE_LABEL."
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$AUTOMERGE_LABEL" --silent
              echo "Added $AUTOMERGE_LABEL to PR #$PR_NUMBER."
            fi
          elif [ "$labelled" = true ]; then
            encoded=$(jq -rn --arg l "$AUTOMERGE_LABEL" '$l|@uri')
            gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$encoded" --silent
            echo "Removed $AUTOMERGE_LABEL from PR #$PR_NUMBER."
          else
            echo "PR #$PR_NUMBER left unlabelled."
          fi

          # Outside the policy: make sure nothing merges it on its own, including a
          # native auto-merge someone enabled earlier.
          if [ "$rc" -ne 0 ]; then
            auto=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.auto_merge != null')
            if [ "$auto" = "true" ]; then
              if gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto; then
                echo "Turned off auto-merge on PR #$PR_NUMBER."
              else
                echo "::warning::Could not turn off auto-merge on PR #$PR_NUMBER; turn it off by hand."
              fi
            fi
          fi

  merge:
    name: Merge once CI has passed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success","skipped","neutral"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    # The triggering workflows finish at different times; never evaluate the
    # same commit twice at once.
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Merge if the bump is allowed and every required check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Shared auto-merge policy. Pasted into both jobs so the workflow never checks
          # out a repository (pull_request_target and workflow_run carry a write token).

          trim() {
            local s="$1"
            s="${s//$'\r'/}"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          ecosystem_skipped() {
            local ecosystem="$1"
            local skip="$2"
            local item
            [ -z "$skip" ] && return 1
            while IFS= read -r item || [ -n "$item" ]; do
              item=$(trim "$item")
              if [ -n "$item" ] && [ "$item" = "$ecosystem" ]; then
                return 0
              fi
            done <<< "$(printf '%s' "$skip" | tr ',' '\n')"
            return 1
          }

          # stdout: one reason line. Returns 0 when eligible, 1 when not, 2 on bad config.
          eligible() {
            local update_type="$1"
            local ecosystem="$2"
            local allowed="$3"
            local allow_unclassified="$4"
            local skip="$5"

            update_type=$(trim "$update_type")
            ecosystem=$(trim "$ecosystem")
            allowed=$(trim "$allowed")
            allow_unclassified=$(trim "$allow_unclassified")

            case "$allowed" in
              patch|minor|major) ;;
              *)
                echo "::error::ALLOWED_UPDATES must be patch, minor, or major."
                return 2
                ;;
            esac

            case "$allow_unclassified" in
              true|false) ;;
              *)
                echo "::error::ALLOW_UNCLASSIFIED must be true or false."
                return 2
                ;;
            esac

            if ecosystem_skipped "$ecosystem" "$skip"; then
              if printf '%s' "$ecosystem" | grep -Eq '^[A-Za-z0-9_.+-]+$'; then
                echo "package-ecosystem '$ecosystem' is in SKIP_ECOSYSTEMS; not auto-merging."
              else
                echo "package-ecosystem is in SKIP_ECOSYSTEMS; not auto-merging."
              fi
              return 1
            fi

            case "$update_type" in
              version-update:semver-patch|version-update:semver-minor|version-update:semver-major)
                ;;
              "")
                if [ "$allow_unclassified" = "true" ]; then
                  echo "update-type is empty and ALLOW_UNCLASSIFIED=true; eligible."
                  return 0
                fi
                echo "update-type is empty and ALLOW_UNCLASSIFIED is not true; not auto-merging."
                return 1
                ;;
              *)
                if [ "$allow_unclassified" = "true" ]; then
                  echo "update-type is unrecognised and ALLOW_UNCLASSIFIED=true; eligible."
                  return 0
                fi
                echo "update-type is unrecognised and ALLOW_UNCLASSIFIED is not true; not auto-merging."
                return 1
                ;;
            esac

            case "$allowed:$update_type" in
              patch:version-update:semver-patch|\
              minor:version-update:semver-patch|minor:version-update:semver-minor|\
              major:version-update:semver-patch|major:version-update:semver-minor|major:version-update:semver-major)
                echo "update-type $update_type is within ALLOWED_UPDATES=$allowed; eligible."
                return 0
                ;;
            esac

            echo "update-type $update_type is above ALLOWED_UPDATES=$allowed; not auto-merging."
            return 1
          }

          # Highest semver update-type declared in Dependabot commit messages.
          # Prints nothing when every commit omits a recognised update-type line.
          highest_update_type() {
            local messages="$1"
            local line rank=0
            while IFS= read -r line || [ -n "$line" ]; do
              line=$(trim "$line")
              case "$line" in
                "update-type: version-update:semver-major")
                  rank=3
                  ;;
                "update-type: version-update:semver-minor")
                  if [ "$rank" -lt 2 ]; then rank=2; fi
                  ;;
                "update-type: version-update:semver-patch")
                  if [ "$rank" -lt 1 ]; then rank=1; fi
                  ;;
              esac
            done <<< "$messages"
            case "$rank" in
              3) printf '%s' "version-update:semver-major" ;;
              2) printf '%s' "version-update:semver-minor" ;;
              1) printf '%s' "version-update:semver-patch" ;;
              *) printf '' ;;
            esac
          }

          # Second path segment of a Dependabot head branch:
          # dependabot/npm_and_yarn/website/lodash-4.2.3 -> npm_and_yarn
          branch_ecosystem() {
            local branch="$1" rest
            case "$branch" in
              dependabot/*/*) ;;
              *)
                printf ''
                return 0
                ;;
            esac
            rest=${branch#dependabot/}
            printf '%s' "${rest%%/*}"
          }

          set -euo pipefail

          if ! printf '%s' "$AUTOMERGE_LABEL" | grep -Eq '^[A-Za-z0-9_.:/-]+$'; then
            echo "::error::AUTOMERGE_LABEL is empty or contains unsupported characters."
            exit 1
          fi

          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *)
              echo "::error::MERGE_METHOD must be squash, merge, or rebase."
              exit 1
              ;;
          esac

          # The open Dependabot PR (from this repo) whose head is still this commit.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '
            [ .[]
              | select(.state == "open"
                  and .user.login == "dependabot[bot]"
                  and .head.sha == env.HEAD_SHA
                  and .head.repo.full_name == env.REPO
                  and .base.repo.full_name == env.REPO)
            ] | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR has $HEAD_SHA as its head; nothing to do."
            exit 0
          fi

          case "$REQUEST_REVIEW" in
            true|false) ;;
            *)
              echo "::error::REQUEST_REVIEW must be true or false."
              exit 1
              ;;
          esac

          # Ask REVIEWERS (or the owner, when the repo is user-owned) to review PR $1.
          # Skips anyone already requested, or who already reviewed this head commit.
          request_review() {
            local pr="$1" why="$2" logins owner login requested reviewed asked=0
            logins=""
            while IFS= read -r login || [ -n "$login" ]; do
              login=$(trim "$login")
              login=${login#@}
              [ -z "$login" ] && continue
              if ! printf '%s' "$login" | grep -Eq '^[A-Za-z0-9-]+$'; then
                echo "::error::REVIEWERS contains an invalid login."
                return 1
              fi
              logins="$logins$login"$'\n'
            done <<< "$(printf '%s' "$REVIEWERS" | tr ',' '\n')"
            if [ -z "$logins" ]; then
              owner=${REPO%%/*}
              if [ "$(gh api "users/$owner" --jq '.type')" = "User" ]; then
                logins="$owner"$'\n'
              else
                echo "::warning::PR #$pr needs a review ($why), but REVIEWERS is empty and $owner is not a user account. Set the reviewers input."
                return 0
              fi
            fi
            requested=$(gh api "repos/$REPO/pulls/$pr/requested_reviewers" --jq '.users[].login')
            reviewed=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" \
              --jq '.[] | select(.commit_id == env.HEAD_SHA) | .user.login')
            while IFS= read -r login; do
              [ -z "$login" ] && continue
              if printf '%s\n' "$requested" "$reviewed" | grep -Fxiq "$login"; then
                echo "$login is already requested on, or has reviewed, PR #$pr at $HEAD_SHA."
                continue
              fi
              if gh api -X POST "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$login" --silent; then
                echo "Requested a review from $login on PR #$pr ($why)."
                asked=$((asked + 1))
              else
                echo "::warning::Could not request a review from $login on PR #$pr (not a collaborator?)."
              fi
            done <<< "$logins"
            echo "Review requests made on PR #$pr: $asked."
          }

          # fetch-metadata only understands pull_request payloads, and this job runs on
          # workflow_run. Dependabot writes the same update-type lines into the commit
          # message, so apply the ceiling again here. A label applied under a looser
          # config is removed rather than trusted.
          messages=$(gh api --paginate "repos/$REPO/pulls/$pr/commits?per_page=100" \
            --jq '.[] | select(.author.login == "dependabot[bot]") | .commit.message')
          if [ -z "$messages" ]; then
            echo "::error::PR #$pr returned no commit messages; not merging."
            exit 1
          fi
          update_type=$(highest_update_type "$messages")
          ecosystem=$(branch_ecosystem "$HEAD_BRANCH")
          set +e
          reason=$(eligible "$update_type" "$ecosystem" "$ALLOWED_UPDATES" "$ALLOW_UNCLASSIFIED" "$SKIP_ECOSYSTEMS")
          rc=$?
          set -e
          printf '%s\n' "$reason"
          if [ "$rc" -eq 2 ]; then
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            mode=merge
            # Re-read the PR itself rather than trusting the list above. The label is
            # interpolated only after AUTOMERGE_LABEL was restricted to a safe character set.
            jq_prog=$(printf '%s\n' \
              '.state == "open"' \
              'and .user.login == "dependabot[bot]"' \
              'and .head.sha == env.HEAD_SHA' \
              "and ([.labels[].name] | index(\"$AUTOMERGE_LABEL\") != null)")
            # The label job (pull_request_target) can still be adding the label when a
            # fast CI workflow completes, so give it a bounded grace period.
            labelled=false
            for attempt in 1 2 3 4 5 6; do
              labelled=$(gh api "repos/$REPO/pulls/$pr" --jq "$jq_prog")
              if [ "$labelled" = "true" ] || [ "$attempt" -eq 6 ]; then
                break
              fi
              sleep 10
            done
            if [ "$labelled" != "true" ]; then
              echo "PR #$pr is not an open, ${AUTOMERGE_LABEL}-labelled Dependabot PR at $HEAD_SHA; leaving it."
              exit 0
            fi
          else
            mode=review
            pr_json=$(gh api "repos/$REPO/pulls/$pr")
            if printf '%s' "$pr_json" | jq -e --arg l "$AUTOMERGE_LABEL" '[.labels[].name] | index($l) != null' > /dev/null; then
              encoded=$(jq -rn --arg l "$AUTOMERGE_LABEL" '$l|@uri')
              gh api -X DELETE "repos/$REPO/issues/$pr/labels/$encoded" --silent
              echo "Removed ${AUTOMERGE_LABEL} from PR #$pr."
            fi
            if printf '%s' "$pr_json" | jq -e '.auto_merge != null' > /dev/null; then
              if gh pr merge "$pr" --repo "$REPO" --disable-auto; then
                echo "Turned off auto-merge on PR #$pr."
              else
                echo "::warning::Could not turn off auto-merge on PR #$pr; turn it off by hand."
              fi
            fi
            if [ "$REQUEST_REVIEW" != "true" ]; then
              echo "PR #$pr is outside the auto-merge policy; leaving it (request-review is off)."
              exit 0
            fi
            echo "PR #$pr is outside the auto-merge policy; a review is requested once its checks pass."
          fi

          # Is REQUIRED_CHECKS empty (ignoring blank and # lines)? Then auto mode.
          named_checks=false
          while IFS= read -r check || [ -n "$check" ]; do
            check=$(trim "$check")
            [ -z "$check" ] && continue
            case "$check" in
              \#*) continue ;;
            esac
            named_checks=true
          done <<< "$REQUIRED_CHECKS"

          if [ "$named_checks" != true ]; then
            # Auto mode: the latest attempt of every pull_request workflow run on
            # this commit must have completed as success, skipped or neutral.
            runs_json=$(gh api --paginate --slurp \
              "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" |
              jq '{workflow_runs: [.[].workflow_runs[]]}')
            count=$(printf '%s' "$runs_json" | jq '[.workflow_runs[].workflow_id] | unique | length')
            if [ "$count" -eq 0 ]; then
              echo "No pull_request workflow runs on $HEAD_SHA; not merging PR #$pr."
              exit 0
            fi
            not_green=$(printf '%s' "$runs_json" | jq -r '
              .workflow_runs | group_by(.workflow_id) | map(max_by(.id))[]
              | select(.status != "completed"
                  or ((.conclusion // "") | IN("success", "skipped", "neutral") | not))
              | "\(.name): \(.status)/\(.conclusion // "none")"')
            if [ -n "$not_green" ]; then
              echo "Not every pull_request workflow run is green on $HEAD_SHA; not merging PR #$pr yet:"
              printf '%s\n' "$not_green"
              exit 0
            fi
            echo "Auto mode: all $count pull_request workflow(s) on $HEAD_SHA are green."
          else
            # Latest run of each required check on this commit, from GitHub Actions
            # only (app id 15368), so no other app can satisfy a check by name.
            runs=$(gh api --paginate \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?app_id=15368&per_page=100" \
              --jq '.check_runs[] | [.id, .name, .status, (.conclusion // "none")] | @tsv')

            while IFS= read -r check || [ -n "$check" ]; do
              check=$(trim "$check")
              [ -z "$check" ] && continue
              case "$check" in
                \#*) continue ;;
              esac
              latest=$(printf '%s\n' "$runs" \
                | awk -F '\t' -v name="$check" '$2 == name' \
                | sort -t "$(printf '\t')" -k1,1n | tail -n 1)
              status=$(printf '%s' "$latest" | cut -f3)
              conclusion=$(printf '%s' "$latest" | cut -f4)
              if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
                echo "\"$check\" is ${status:-missing}/${conclusion:-none} on $HEAD_SHA; not merging PR #$pr yet."
                exit 0
              fi
            done <<< "$REQUIRED_CHECKS"
          fi

          if [ "$mode" = review ]; then
            request_review "$pr" "outside the auto-merge policy, checks passed on $HEAD_SHA"
            exit 0
          fi

          # GITHUB_TOKEN cannot merge changes to workflow files, so leave any
          # such PR (normally a GitHub Actions bump) for a manual merge.
          workflow_files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
            --jq '.[] | select(.filename | startswith(".github/workflows/")) | .filename')
          if [ -n "$workflow_files" ]; then
            echo "::notice::PR #$pr changes .github/workflows/ ($(echo "$workflow_files" | paste -sd, -)); GITHUB_TOKEN cannot merge workflow changes, leaving it for a manual merge."
            if [ "$REQUEST_REVIEW" = "true" ]; then
              request_review "$pr" "changes .github/workflows/, checks passed on $HEAD_SHA"
            fi
            exit 0
          fi

          echo "All required checks passed on $HEAD_SHA; ${MERGE_METHOD}-merging PR #$pr."
          if ! gh pr merge "$pr" --repo "$REPO" "--${MERGE_METHOD}" --match-head-commit "$HEAD_SHA"; then
            echo "::warning::Could not merge PR #$pr at $HEAD_SHA (conflict, or the branch is stale after another merge). Leaving it for Dependabot to rebase."
            exit 0
          fi

          if [ -z "$DEPLOY_WORKFLOW" ]; then
            echo "Merged PR #$pr. DEPLOY_WORKFLOW is empty, so no follow-up workflow was dispatched."
            exit 0
          fi

          deploy_ref=$(trim "$DEPLOY_REF")
          if [ -z "$deploy_ref" ]; then
            deploy_ref=$(gh api "repos/$REPO/pulls/$pr" --jq '.base.ref')
          fi
          if [ -z "$deploy_ref" ]; then
            echo "::warning::Merged PR #$pr but could not determine a ref to dispatch ${DEPLOY_WORKFLOW}."
            exit 0
          fi
          if gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPO" --ref "$deploy_ref"; then
            echo "Dispatched ${DEPLOY_WORKFLOW} on ${deploy_ref} after merging PR #$pr."
          else
            echo "::warning::Merged PR #$pr but could not dispatch ${DEPLOY_WORKFLOW} on ${deploy_ref}; run it on that ref manually to ship the merge."
          fi
